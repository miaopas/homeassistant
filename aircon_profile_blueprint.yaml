blueprint:
  name: 空调档位控制蓝图
  description: >
    根据自定义档位自动设置空调参数，支持任意数量的档位配置。v2.0

    功能特性：
    - 支持无限数量的自定义档位（睡眠、普通、强力、静音等）
    - 手动调整空调后智能匹配档位选择器
    - 双向同步：档位和空调状态始终保持一致
    - 灵活的配置方式，每个空调可以有不同的档位
    - 物理按键一键开关空调（关→普通模式，开→关闭）
    - 空调开关状态用物理开关上的指示灯同步显示
    - v2.0 起完全不再依赖任何虚拟事件实体，全部在 HA 侧完成

    使用前需要先创建：
    1. input_select 档位选择器（在 Dashboard 显示为下拉菜单）

    档位参数直接在蓝图配置中定义，无需创建额外的helper实体！
    使用物理按键功能时，请确保已启用"关闭功能"，且档位列表中存在"普通"档位。
  domain: automation
  input:
    ac_entity:
      name: 空调设备
      description: 选择需要控制的空调设备
      selector:
        entity:
          domain: climate

    profile_select:
      name: 档位选择器
      description: 选择档位控制的 input_select 实体
      selector:
        entity:
          domain: input_select

    none_option:
      name: 空档值
      description: input_select 中代表"无"状态的选项文字
      default: 无
      selector:
        text:

    enable_turn_off:
      name: 启用关闭功能
      description: 是否添加"关闭"档位功能（选择后直接关闭空调）
      default: true
      selector:
        boolean:

    turn_off_option:
      name: 关闭档位名称
      description: input_select 中代表"关闭空调"的选项文字（仅在启用关闭功能时有效）
      default: 关闭
      selector:
        text:

    click_entity:
      name: 物理按键事件实体
      description: 用于开关空调的物理按键 event 实体（每次按下触发事件）
      selector:
        entity:
          domain: event

    button_on_profile:
      name: 按键开机档位
      description: 空调关闭时按下按键切换到的档位名称（须存在于档位列表和 input_select 中）
      default: 普通
      selector:
        text:

    led_on_entity:
      name: 开指示灯实体
      description: 用于点亮物理开关指示灯的 notify 实体
      selector:
        entity:
          domain: notify

    led_off_entity:
      name: 关指示灯实体
      description: 用于熄灭物理开关指示灯的 notify 实体
      selector:
        entity:
          domain: notify

    led_index:
      name: 指示灯位置
      description: 指示灯在开关上的位置索引（0=左，1=右）
      default: 1
      selector:
        number:
          min: 0
          max: 3
          mode: box

    profiles:
      name: 档位配置列表
      description: >
        定义各个档位及其固定参数值。
        格式：档位名称=温度,风速,模式

        示例：
        睡眠=27,low,cool
        普通=26,auto,cool
        强力=16,high,cool
        静音=28,low,cool
      default: |
        睡眠=27,low,cool
        普通=26,auto,cool
        强力=16,high,cool
      selector:
        text:
          multiline: true

mode: queued

triggers:
  - platform: state
    entity_id: !input profile_select
    id: apply_profile

  - platform: state
    entity_id: !input click_entity
    id: button_toggle

  - platform: state
    entity_id: !input ac_entity
    attribute: temperature
    id: manual_reset

  - platform: state
    entity_id: !input ac_entity
    attribute: fan_mode
    id: manual_reset

  - platform: state
    entity_id: !input ac_entity
    attribute: hvac_action
    id: manual_reset

  - platform: state
    entity_id: !input ac_entity
    id: power_change

variables:
  ac_entity_var: !input ac_entity
  profile_select_var: !input profile_select
  none_option: !input none_option
  enable_turn_off: !input enable_turn_off
  turn_off_option: !input turn_off_option
  profiles_config: !input profiles
  button_on_profile_var: !input button_on_profile
  led_on_entity_var: !input led_on_entity
  led_off_entity_var: !input led_off_entity
  led_index_var: !input led_index
  current_profile: "{{ states(profile_select_var) }}"

  # 读取空调当前状态
  current_ac_state: "{{ states(ac_entity_var) }}"
  current_temp: "{{ state_attr(ac_entity_var, 'temperature') }}"
  current_fan: "{{ state_attr(ac_entity_var, 'fan_mode') }}"
  current_hvac: "{{ states(ac_entity_var) }}"

  # 解析档位配置
  profiles_dict: >
    {% set ns = namespace(result={}) %}
    {% for line in profiles_config.split('\n') %}
      {% if '=' in line %}
        {% set parts = line.split('=') %}
        {% set profile_name = parts[0].strip() %}
        {% set values = parts[1].split(',') %}
        {% set ns.result = dict(ns.result, **{profile_name: {
          'temp': values[0].strip() | float,
          'fan': values[1].strip(),
          'mode': values[2].strip()
        }}) %}
      {% endif %}
    {% endfor %}
    {{ ns.result }}

  # 智能匹配当前空调状态对应的档位
  matched_profile: >
    {% set ns = namespace(result=none_option) %}
    {% if current_hvac == 'off' and enable_turn_off %}
      {% set ns.result = turn_off_option %}
    {% elif current_hvac != 'off' and current_temp is not none and current_fan is not none and current_hvac is not none %}
      {% for line in profiles_config.split('\n') %}
        {% if '=' in line %}
          {% set parts = line.split('=') %}
          {% set profile_name = parts[0].strip() %}
          {% set values = parts[1].split(',') %}
          {% set profile_temp = values[0].strip() | float %}
          {% set profile_fan = values[1].strip() %}
          {% set profile_mode = values[2].strip() %}
          {% if (profile_temp - (current_temp | float)) | abs < 0.5 and profile_fan == current_fan and profile_mode == current_hvac %}
            {% set ns.result = profile_name %}
          {% endif %}
        {% endif %}
      {% endfor %}
    {% endif %}
    {{ ns.result }}

actions:
  - choose:
      # 物理按键 - 开关空调（toggle）
      - conditions:
          - condition: trigger
            id: button_toggle
          - condition: template
            value_template: >
              {{ trigger.from_state is not none and
                 trigger.to_state.state not in ['unknown', 'unavailable'] }}
        sequence:
          - choose:
              # 空调当前关闭 -> 打开到普通档位
              - conditions:
                  - condition: template
                    value_template: "{{ current_ac_state == 'off' }}"
                sequence:
                  - service: input_select.select_option
                    target:
                      entity_id: !input profile_select
                    data:
                      option: "{{ button_on_profile_var }}"
            # 空调当前打开 -> 关闭
            default:
              - service: input_select.select_option
                target:
                  entity_id: !input profile_select
                data:
                  option: "{{ turn_off_option }}"

      # 关闭空调
      - conditions:
          - condition: trigger
            id: apply_profile
          - condition: template
            value_template: "{{ enable_turn_off }}"
          - condition: template
            value_template: "{{ current_profile == turn_off_option }}"
        sequence:
          - service: climate.turn_off
            target:
              entity_id: !input ac_entity

      # 应用档位设置
      - conditions:
          - condition: trigger
            id: apply_profile
          - condition: template
            value_template: "{{ current_profile != none_option and current_profile not in ['unknown', 'unavailable'] }}"
        sequence:
          - variables:
              profile_config: "{{ profiles_dict.get(current_profile, none) }}"

          - condition: template
            value_template: "{{ profile_config is not none }}"

          - service: climate.set_temperature
            target:
              entity_id: !input ac_entity
            data:
              temperature: "{{ profile_config.temp }}"

          - service: climate.set_fan_mode
            target:
              entity_id: !input ac_entity
            data:
              fan_mode: "{{ profile_config.fan }}"

          - service: climate.set_hvac_mode
            target:
              entity_id: !input ac_entity
            data:
              hvac_mode: "{{ profile_config.mode }}"

      # 手动修改后智能匹配档位
      - conditions:
          - condition: trigger
            id: manual_reset
          - condition: template
            value_template: "{{ matched_profile != current_profile }}"
        sequence:
          - service: input_select.select_option
            target:
              entity_id: !input profile_select
            data:
              option: "{{ matched_profile }}"

      # 空调开关状态变化时同步指示灯
      - conditions:
          - condition: trigger
            id: power_change
          - condition: template
            value_template: >
              {{ trigger.from_state.state != trigger.to_state.state and
                 (trigger.from_state.state == 'off' or trigger.to_state.state == 'off') and
                 trigger.to_state.state not in ['unknown', 'unavailable'] }}
        sequence:
          - choose:
              # 空调已开启 -> 点亮指示灯
              - conditions:
                  - condition: template
                    value_template: "{{ trigger.to_state.state != 'off' }}"
                sequence:
                  - action: notify.send_message
                    target:
                      entity_id: "{{ led_on_entity_var }}"
                    data:
                      message: "[{{ led_index_var }}]"
            # 空调已关闭 -> 熄灭指示灯
            default:
              - action: notify.send_message
                target:
                  entity_id: "{{ led_off_entity_var }}"
                data:
                  message: "[{{ led_index_var }}]"
